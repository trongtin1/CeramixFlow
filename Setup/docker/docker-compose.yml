version: '3.8'

services:
  # 1. PostgreSQL (Dùng khi chạy Local Database thay vì Supabase)
  postgres:
    image: postgres:16-alpine
    container_name: ceramixflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: ceramixflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  # 2. Backend Server (Node.js + TypeScript)
  backend:
    build:
      context: ../../backend
      dockerfile: ../Setup/docker/Dockerfile.backend
    container_name: ceramixflow-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword123@postgres:5432/ceramixflow_db?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgrespassword123@postgres:5432/ceramixflow_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  # 3. Frontend App (React + Vite)
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../Setup/docker/Dockerfile.frontend
    container_name: ceramixflow-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
