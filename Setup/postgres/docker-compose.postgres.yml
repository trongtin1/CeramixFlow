version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ceramixflow-postgres-standalone
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: ceramixflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_standalone_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

volumes:
  postgres_standalone_data:
